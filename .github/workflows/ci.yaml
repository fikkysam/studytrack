name: StudyTrack CI

on:
  workflow_dispatch:
    inputs:
      courses:
        description: "Comma-separated course names to test"
        required: false
        type: string
        default: "Cloud Computing,Blockchain Security"
  push:
    branches:
      - main
      - course-report
  pull_request:
    branches:
      - main

jobs:
  quality-checks:
    name: StudyTrack Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run HTML validation, ESLint and Playwright
        env:
          STUDYTRACK_COURSES: ${{ inputs.courses }}
        run: npm run check

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studytrack-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright test results (if generated)
        if: always() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: studytrack-test-results
          path: test-results/
          retention-days: 14
